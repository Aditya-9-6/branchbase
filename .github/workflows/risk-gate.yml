name: BranchBase Risk Gate Check

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'db/migrations/**'
      - 'sql/**'
      - '**/*.sql'
      - '.branchbase/risk-policy.yml'

permissions:
  contents: read

concurrency:
  group: risk-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk-gate:
    name: Schema Migration Risk Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - name: Build BranchBase CLI
        run: go build -o /usr/local/bin/branchbase ./cmd/branchbase

      - name: Evaluate Migration Risk Gate
        run: |
          echo "🛡️ Evaluating schema migration risk..."
          branchbase risk check --json --offline
