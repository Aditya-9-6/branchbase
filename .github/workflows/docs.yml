name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'

      - name: Install MkDocs & Material Theme
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Build MkDocs Site
        run: |
          mkdir -p docs/assets
          if [ -d "assets" ]; then cp -r assets/* docs/assets/ 2>/dev/null || true; fi
          cp ARCHITECTURE.md docs/architecture.md
          cp CONTRIBUTING.md docs/contributing.md
          cp CODE_OF_CONDUCT.md docs/code-of-conduct.md
          cp SECURITY.md docs/security.md
          cp ROADMAP.md docs/roadmap.md
          cp CHANGELOG.md docs/changelog.md
          mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@983d7712d7b0e42e82918173b950f896677f7561 # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
